[project]
name = "taskee"
version = "0.0.4"
description = "Notifications for Earth Engine tasks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Aaron Zuspan" }]
keywords = ["earth-engine", "notifications", "tasks", "cli", "command-line"]
dependencies = [
    "earthengine-api",
    "rich",
    "humanize",
    "notify-py",
    "requests",
    "click",
    "rich-click>=1.2.1",
    "pydantic",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/aazuspan/taskee"

[project.scripts]
taskee = "taskee.cli.cli:taskee"

[dependency-groups]
dev = [
    "poethepoet>=0.44.0",
    "ruff>=0.15.8",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["E", "I", "F", "B", "FA", "UP", "PT", "Q", "RET", "SIM", "PERF", "ERA", "TC"]
ignore = ["PERF203"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["taskee"]

[tool.pytest.ini_options]
markers = [
    "no_config: mark test to run without a config file",
]
filterwarnings = [
    # loguru 0.6.0 (pinned transitively by notify-py) uses the deprecated
    # asyncio.iscoroutinefunction; nothing we can fix without downgrading notify-py.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:loguru",
]

[tool.poe.tasks]
lint = "ruff check . --fix"
format = "ruff format ."
check = ["lint", "format"]
test = "pytest"